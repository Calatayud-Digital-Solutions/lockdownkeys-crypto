# Publishes via npm Trusted Publishing (OIDC)—no NPM_TOKEN for publish, avoids EOTP with 2FA.
# One-time: npmjs.com → package → Settings → Trusted publishing → GitHub Actions
#   - Repository must match package.json "repository.url"
#   - Workflow file name (exact): publish-npm.yml
# Requires: npm CLI ≥ 11.5.1, Node ≥ 22.14 (see https://docs.npmjs.com/trusted-publishers )
# Release: bump package.json, push main, tag vX.Y.Z, push tag.

name: Publish npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org

      - name: npm version for OIDC publish
        run: npm install -g npm@^11.5.1

      - name: Verify git tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::package.json has version $VER but the tag is v$TAG. Bump and commit package.json first, then create the tag on that commit (see CONTRIBUTING.md)."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Provenance is generated automatically when publishing via trusted publishing (public repo + public package).
      - name: Publish to npm
        run: npm publish --access public
