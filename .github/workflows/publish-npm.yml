# Publishes to npm when a SemVer tag is pushed (e.g. v0.1.1).
# Setup: add repository secret NPM_TOKEN (npm granular access token with publish for @calaespi).
# Release flow: bump version in package.json, commit, then:
#   git tag vX.Y.Z && git push origin main && git push origin vX.Y.Z
# Optional: run this workflow manually from the Actions tab (workflow_dispatch).

name: Publish npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify git tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::package.json version ($VER) does not match tag (v$TAG)"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
